<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit d'arène</title>
<!-- Aperçu du kit d'arène (lot LKIT). Servi par Vite : http://localhost:5173/arena-kit.html
     ?vue=arene (défaut) : les pièces assemblées façon « Battlefield », 2 persos KayKit pour l'échelle.
     ?vue=kit : toutes les pièces en grille, rotation lente, fond neutre.
     ?fixe=1 : pas de rotation (captures). -->
<script>
  // three depuis node_modules (serveur Vite) sinon depuis le CDN : décidé avant tout module.
  (function () {
    var local = false;
    try { var x = new XMLHttpRequest(); x.open('HEAD', '/node_modules/three/package.json', false); x.send(); local = x.status === 200; } catch (e) {}
    var base = local ? '/node_modules/three/' : 'https://cdn.jsdelivr.net/npm/three@0.186.1/';
    var s = document.createElement('script');
    s.type = 'importmap';
    s.textContent = JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
    document.currentScript.after(s);
  })();
</script>
<style>
  :root { --fond-haut: #d9d4cc; --fond-bas: #b9b2a8; --encre: #2b1d14; --papier: #f3e3c3; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond-bas); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  #bandeau { position: fixed; left: 16px; top: 12px; color: var(--encre); font-weight: 800; font-size: 15px; letter-spacing: .02em; }
  #bandeau a { color: var(--encre); margin-left: 12px; font-weight: 700; }
  .etiquette { position: fixed; transform: translate(-50%, 0); color: var(--encre); font-size: 11px; font-weight: 700; text-align: center; white-space: nowrap; pointer-events: none; }
  .etiquette b { display: block; font-size: 12px; font-weight: 800; }
</style>
</head>
<body>
<div id="bandeau">Kit d'arène · <span id="compte">chargement…</span> <a href="?vue=arene">arène</a><a href="?vue=kit">pièces</a></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const params = new URLSearchParams(location.search);
const VUE = params.get('vue') || 'arene';
const FIXE = params.has('fixe');
const BASE = 'assets/arena-kit/';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;

// fond : dégradé vertical neutre-chaud (canvas 2 px), brouillard assorti
function gradientTexture(top, bottom) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const lg = g.createLinearGradient(0, 0, 0, 256);
  lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const CIELS = { archipel: ['#c9b8c4', '#e8c9a8'], galion: ['#6f7f7b', '#a9b3ac'], cuisine: ['#8a7f76', '#c4b39f'] };
const CIEL = VUE === 'arene' ? (CIELS[params.get('map')] ?? CIELS.archipel) : ['#dcd7cf', '#b7b0a6'];
scene.background = gradientTexture(CIEL[0], CIEL[1]);
if (VUE === 'arene') scene.fog = new THREE.Fog(CIEL[1], 30, 95);

// lumière : soleil chaud rasant + ciel froid, contre-jour léger
scene.add(new THREE.HemisphereLight('#dfe6f2', '#6a5a50', 0.9));
const soleil = new THREE.DirectionalLight('#fff1dc', 2.6);
soleil.position.set(-12, 16, 9);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
soleil.shadow.bias = -0.0005; soleil.shadow.normalBias = 0.02;
scene.add(soleil);
const contre = new THREE.DirectionalLight('#ffd9b0', 0.8);
contre.position.set(8, 6, -14);
scene.add(contre);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load = (url) => loader.loadAsync(url);

async function piece(nom) {
  const g = await load(BASE + nom + '.glb');
  g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g.scene;
}

let kit = null;
try { kit = await (await fetch(BASE + 'kit.json')).json(); } catch { /* kit.json absent : liste par défaut */ }
const LISTE = kit ? kit.pieces.map((p) => p.nom) : ['plateau_pierre', 'plateforme_pierre_S', 'plateforme_pierre_M', 'plateforme_pierre_L', 'bord_pierre', 'ile_lointaine_A', 'ile_lointaine_B'];
const infos = Object.fromEntries((kit?.pieces ?? []).map((p) => [p.nom, p]));
const has = (n) => LISTE.includes(n);

const tournants = [];
const mixers = [];
const etiquettes = [];

async function perso(x, z, yaw) {
  const g = await load('assets/characters/knight.glb');
  const o = SkeletonUtils.clone(g.scene);
  const b = new THREE.Box3().setFromObject(o);
  o.scale.setScalar(1.85 / (b.max.y - b.min.y)); // capsule du jeu : 1,8 m
  o.position.set(x, 0, z); o.rotation.y = yaw;
  o.traverse((m) => { if (m.isMesh) { m.castShadow = true; } });
  const clip = g.animations.find((a) => /^idle$/i.test(a.name)) ?? g.animations.find((a) => /idle/i.test(a.name));
  if (clip) { const mx = new THREE.AnimationMixer(o); mx.clipAction(clip).play(); mixers.push(mx); }
  scene.add(o);
}

// Compositions de démonstration (disposition « Battlefield » : 2 plateformes latérales, 1 haute au fond)
const ARENES = {
  archipel: {
    plateau: 'plateau_pierre', plateformes: ['plateforme_pierre_M', 'plateforme_pierre_M', 'plateforme_pierre_S'],
    couverts: [['muret_ruine', -3.2, 0, -4.4, 1, 0.15], ['tonneau', 6.9, 0, 2.6, 1, 0], ['caisse', -7.2, 0, -2.4, 1, 0.5]],
    fond: [
      ['ile_lointaine_A', -30, -4, -46, 2.6, 0.4], ['ile_lointaine_B', 26, 1, -52, 2.2, 1.2], ['ile_lointaine_B', 44, -9, -30, 1.8, 2.1],
      ['ile_lointaine_A', -52, 3, -70, 3.2, 2.8], ['rocher_M', -15, -3, -12, 1, 0.3], ['rocher_S', 16, 3.5, -14, 1, 1.1],
      ['rocher_L', 20, -7, 4, 1, 2.2], ['nuage_A', -22, -9, -20, 3, 0], ['nuage_B', 18, -11, -26, 3.5, 1], ['nuage_A', 0, -14, -40, 5, 2],
      ['nuage_B', -40, 8, -64, 4, 0.5], ['nuage_A', 38, 10, -70, 4.5, 3],
    ],
  },
  galion: {
    plateau: 'plateau_pont', plateformes: ['radeau_M', 'radeau_M', 'radeau_S'],
    couverts: [['caisse', -6.6, 0, -2.0, 1, 0.3], ['tonneau', 6.4, 0, 2.2, 1, 0], ['tonneau', 7.2, 0, 1.3, 1, 1]],
    fond: [['nuage_A', -24, -8, -26, 3.5, 0], ['nuage_B', 20, -10, -30, 4, 1], ['nuage_A', 2, -13, -46, 5, 2], ['nuage_B', -44, 6, -66, 4.5, 0.5]],
  },
  cuisine: {
    plateau: 'plateau_cuisine', plateformes: ['planche_M', 'planche_M', 'planche_S'],
    couverts: [['tonneau', 6.8, 0, 2.4, 1, 0]],
    fond: [],
  },
};

if (VUE === 'arene') {
  const A = ARENES[params.get('map') || 'archipel'] ?? ARENES.archipel;
  const racine = new THREE.Group(); scene.add(racine);
  const place = async (nom, x, y, z, s = 1, ry = 0) => {
    if (!has(nom)) return null;
    const o = await piece(nom); o.position.set(x, y, z); o.scale.setScalar(s); o.rotation.y = ry; racine.add(o); return o;
  };
  await place(A.plateau, 0, 0, 0);
  const [p1, p2, p3] = A.plateformes;
  await place(p1, -4.6, 2.4, -1.2);
  await place(p2, 4.6, 2.4, -1.2);
  await place(p3, 0, 2.8, -4.2);
  for (const c of A.couverts) await place(...c);
  // fond : îles, rochers, nuages (les ombres portées au loin sont inutiles)
  for (const [nom, x, y, z, s, ry] of A.fond) {
    const o = await place(nom, x, y, z, s, ry);
    if (o) o.traverse((m) => { if (m.isMesh) { m.castShadow = false; m.receiveShadow = false; } });
  }
  await perso(-4.75, 0.6, Math.PI / 2);
  await perso(4.75, 0.6, -Math.PI / 2);
  camera.position.set(0, 9.5, 24); camera.lookAt(0, 0.6, -1);
  tournants.push({ obj: racine, lent: true });
} else {
  const cols = 6; const pas = 6.6;
  const lignes = Math.ceil(LISTE.length / cols);
  const sol = new THREE.Mesh(new THREE.CircleGeometry(80, 48), new THREE.MeshStandardMaterial({ color: '#b7b0a6', roughness: 1 }));
  sol.rotation.x = -Math.PI / 2; sol.position.y = -3.2; sol.receiveShadow = true; scene.add(sol);
  for (let i = 0; i < LISTE.length; i++) {
    const nom = LISTE[i];
    const o = await piece(nom);
    const b = new THREE.Box3().setFromObject(o); const t = b.getSize(new THREE.Vector3());
    const s = 4.3 / Math.max(t.x, t.z, t.y * 1.2);
    o.scale.setScalar(s);
    const pivot = new THREE.Group(); pivot.add(o);
    const c = b.getCenter(new THREE.Vector3()); o.position.set(-c.x * s, -c.y * s, -c.z * s);
    const col = i % cols; const lig = Math.floor(i / cols);
    pivot.position.set((col - (cols - 1) / 2) * pas, 0, (lig - (lignes - 1) / 2) * pas * 0.9);
    scene.add(pivot); tournants.push({ obj: pivot, lent: false, phase: i * 0.7 });
    const info = infos[nom];
    const el = document.createElement('div'); el.className = 'etiquette';
    el.innerHTML = `<b>${nom}</b>${info ? `${info.triangles} tri · ${info.ko} Ko` : ''}`;
    document.body.appendChild(el); etiquettes.push({ el, pivot });
  }
  soleil.shadow.camera.left = soleil.shadow.camera.bottom = -24; soleil.shadow.camera.right = soleil.shadow.camera.top = 24;
  soleil.shadow.camera.updateProjectionMatrix();
  camera.position.set(0, 30, 29); camera.lookAt(0, -1.5, 2.2);
}
document.getElementById('compte').textContent = `${LISTE.length} pièces`;

function redim() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', redim);

const horloge = new THREE.Clock();
let t = 0;
function frame() {
  const dt = Math.min(horloge.getDelta(), 0.05); t += dt;
  for (const m of mixers) m.update(dt);
  if (!FIXE) for (const r of tournants) r.obj.rotation.y = r.lent ? Math.sin(t * 0.12) * 0.35 : t * 0.25 + r.phase;
  else for (const r of tournants) if (!r.lent) r.obj.rotation.y = 0.6 + r.phase * 0.3;
  const v = new THREE.Vector3();
  for (const e of etiquettes) {
    v.set(e.pivot.position.x, e.pivot.position.y - 2.2, e.pivot.position.z + 2.3).project(camera);
    e.el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`; e.el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
window.kitPret = true;
window.kitInfo = () => ({ appels: renderer.info.render.calls, triangles: renderer.info.render.triangles, pieces: LISTE.length });
</script>
</body>
</html>
