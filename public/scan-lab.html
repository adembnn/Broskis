<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Lab</title>
<!-- Labo du scan (lot LSCAN) : outil de développement pour Adem, servi par `npm run dev` sur /scan-lab.html.
     Photo -> JSON Gemini (physique comprise) -> stats dérivées -> sticker -> objet 3D -> lancer simulé contre un
     mannequin, avec les VRAIES formules du jeu. Deux emplacements pour comparer (canette contre chaise). -->
<style>
  :root { --ink:#2b1d14; --paper:#f2e6cf; --card:#fbf5e8; --muted:#8a7a66; --p1:#e0662b; --p2:#3a7bd5; --ok:#3b7a57; --bad:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ink); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; color:var(--paper); }
  header h1 { margin:0 12px 0 0; font-size:20px; letter-spacing:.02em; }
  header .hint { color:#cbb99c; }
  button, label.btn { background:var(--paper); color:var(--ink); border:2px solid var(--ink); border-radius:8px; padding:7px 12px; font-weight:700; cursor:pointer; }
  button.snap { background:var(--p1); color:#fff; }
  #cam { width:220px; border-radius:8px; display:none; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 12px; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }
  .slot { background:var(--card); border-radius:12px; padding:12px; min-height:200px; }
  .slot h2 { margin:0; font-size:18px; }
  .slot .sub { color:var(--muted); margin:2px 0 8px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--ink); color:var(--paper); font-size:12px; margin-right:4px; }
  .vis { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .vis > * { width:100%; aspect-ratio:4/3; object-fit:contain; background:#e9dcc3; border-radius:8px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  table { border-collapse:collapse; width:100%; }
  td { padding:2px 4px; border-bottom:1px solid #e3d5bb; }
  td:first-child { color:var(--muted); }
  .bar { display:grid; grid-template-columns:90px 1fr 48px; gap:6px; align-items:center; margin:3px 0; }
  .bar i { display:block; height:10px; border-radius:5px; background:var(--p1); }
  .bar .track { background:#e3d5bb; border-radius:5px; }
  .bar b { text-align:right; font-variant-numeric:tabular-nums; }
  canvas.sim { width:100%; height:auto; background:#fff8ea; border-radius:8px; margin-top:10px; display:block; }
  .nums { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px; }
  .nums span b { font-size:16px; }
  details pre { max-height:260px; overflow:auto; background:#efe3cc; padding:8px; border-radius:8px; font-size:12px; }
  .status { color:var(--p1); font-weight:700; }
  .err { color:var(--bad); }
  #history { display:flex; gap:8px; overflow-x:auto; padding:0 16px 16px; }
  #history .h { flex:0 0 auto; width:120px; background:var(--card); border-radius:8px; padding:4px; cursor:pointer; font-size:12px; }
  #history .h img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; }
  #drop { position:fixed; inset:0; background:rgba(224,102,43,.25); border:4px dashed var(--p1); display:none; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>Scan Lab</h1>
  <label class="btn">Photo…<input id="file" type="file" accept="image/*" hidden></label>
  <button id="camBtn">Webcam</button>
  <video id="cam" autoplay muted playsinline></video>
  <button id="snap" class="snap" hidden>SNAP</button>
  <span class="hint">Drop a photo anywhere. The newest scan goes left, the previous one moves right. Click the history to compare.</span>
</header>
<main><section class="slot" id="slot0"></section><section class="slot" id="slot1"></section></main>
<div id="history"></div>
<div id="drop"></div>
<script type="module" src="/src/ia/lab/scanLab.ts"></script>
</body>
</html>
